# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-capybara
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.3.1
  DisplayCopNames: true
  Include:
    - "**/*.rb"
    - "**/*.jbuilder"
    - "**/*.rake"
    - "config.ru"
    - "Gemfile"
    - "Rakefile"
  Exclude:
    - "bin/**/*"
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"
    - "db/schema.rb"
    - "db/primary_de_schema.rb"
    - "db/de_schema.rb"
    - "test/**/*"
    - "log/**/*"
    - "node_modules/**/*"
    - "public/**/*"
    - "tmp/**/*"
    - "vendor/**/*"

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/LineContinuationLeadingSpace: # new in 1.31
  Enabled: true
Layout/LineContinuationSpacing: # new in 1.31
  Enabled: true
Layout/LineEndStringConcatenationIndentation: # new in 1.18
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/MissingSuper:
  Enabled: false
  Exclude:
    - "app/services/**/*.rb"

Lint/AmbiguousOperatorPrecedence: # new in 1.21
  Enabled: true
Lint/AmbiguousRange: # new in 1.19
  Enabled: true
Lint/ConstantOverwrittenInRescue: # new in 1.31
  Enabled: true
Lint/DuplicateMagicComment: # new in 1.37
  Enabled: true
Lint/EmptyInPattern: # new in 1.16
  Enabled: true
Lint/IncompatibleIoSelectWithFiberScheduler: # new in 1.21
  Enabled: true
Lint/NonAtomicFileOperation: # new in 1.31
  Enabled: true
Lint/RefinementImportMethods: # new in 1.27
  Enabled: true
Lint/RequireRangeParentheses: # new in 1.32
  Enabled: true
Lint/RequireRelativeSelfPath: # new in 1.22
  Enabled: true
Lint/UselessRescue: # new in 1.43
  Enabled: true
Lint/UselessRuby2Keywords: # new in 1.23
  Enabled: true

Metrics/AbcSize:
  Max: 45
  Exclude:
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"

Metrics/ParameterLists:
  Max: 7
  Exclude:
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"

Metrics/CollectionLiteralLength: # new in 1.47
  Enabled: true

Layout/LineLength:
  Max: 120
  Exclude:
    - 'db/migrate/*.rb'
    - "db/migrate_shards/**/*.rb"
    - "spec/**/*_spec.rb"

Metrics/MethodLength:
  Max: 35
  Exclude:
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"

Metrics/ModuleLength:
  Max: 130
  Exclude:
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"
    - "spec/**/*_spec.rb"
RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/DescribeClass:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

Metrics/ClassLength:
  Max: 130
  Exclude:
    - "app/controllers/api/**/*.rb"
    - "db/migrate/**/*.rb"
    - "db/migrate_shards/**/*.rb"

Naming/PredicatePrefix:
  ForbiddenPrefixes:
    - is_
  Exclude:
    - "spec/**/*"

Naming/AccessorMethodName:
  Exclude:
    - "app/datatables/*.rb"

Naming/BlockForwarding: # new in 1.24
  Enabled: true

Rails:
  Enabled: true

Rails/ApplicationController:
  Enabled: false

Rails/ActiveRecordOverride:
  Enabled: true

Rails/FilePath:
  Enabled: false

Rails/Output:
  Enabled: false

Rails/OutputSafety:
  Enabled: false

Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test
    - staging

Rails/RakeEnvironment:
  Exclude:
    - "lib/tasks/auto_annotate_models.rake"

Style/BlockDelimiters:
  Exclude:
    - "spec/**/*_spec.rb"

Style/ClassAndModuleChildren:
  Exclude:
    - "app/concepts/**/*.rb"

Style/HashConversion:
  Enabled: true

Style/StringChars:
  Enabled: true

Rails/SkipsModelValidations:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  EnforcedStyle: template

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/LambdaCall:
  EnforcedStyle: call
  Exclude:
    - "app/**/*.jbuilder"

Style/MethodCallWithArgsParentheses:
  Enabled: true
  AllowedMethods:
    - require
    - require_relative
    - puts
  Exclude:
    - "config.ru"
    - "Gemfile"
    - "lib/**/*.rake"
    - "spec/**/*.rb"
    - "db/migrate/*.rb"
    - "config/**/*.rb"
    - "app/**/*.jbuilder"

Style/StringLiterals:
  EnforcedStyle: double_quotes
  Exclude:
    - "Gemfile"

Style/SymbolArray:
  MinSize: 3
  Exclude:
    - "Gemfile"

Style/WordArray:
  MinSize: 3

Style/Strip:
  Enabled: true

Style/Sample:
  Enabled: true

Style/RedundantSortBy:
  Enabled: true

Style/OptionalBooleanParameter:
  Enabled: true
  Exclude:
    - "app/workers/**/*.rb"

Metrics/BlockLength:
  Exclude:
    - "app/views/**/*"
    - "app/controllers/api/**/*"
    - "config/**/*.rb"
    - "db/**/*.rb"
    - "lib/**/*.rake"
    - "spec/**/*"
    - "app/admin/**"
    - "app/models/concerns/**"

Bundler/OrderedGems:
  Enabled: false

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

Lint/DeprecatedOpenSSLConstant:
