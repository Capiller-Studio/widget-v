default: &default
  adapter: postgresql
  encoding: unicode
  username: <%= ENV.fetch('DB_USERNAME') { 'postgres' } %>
  password: "<%= ENV.fetch('DB_PASSWORD') { 'postgres' } %>"
  host: <%= ENV['DB_HOST'] %>
  pool: <%= ENV.fetch("DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 5)) %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: deskbolic_development
  primary_replica:
    <<: *default
    database: deskbolic_development
    replica: true
  de:
    <<: *default
    database: deskbolic_de_development
    migrations_paths:
      - db/migrate_shards
      - <%= Core::Engine.root.join("db/migrate_shards") %>
    database_tasks: true
  de_replica:
    <<: *default
    database: deskbolic_de_development
    replica: true

